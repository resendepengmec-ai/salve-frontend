<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- CSP: script-src ainda precisa de 'unsafe-inline' porque todo o JS do app vive
     inline em cada HTML (sem etapa de build); script-src 'self' sozinho fecharia
     a execucao das paginas. accounts.google.com cobre o SDK de login (GSI) e o
     popup/iframe de autenticacao; salve-backend.onrender.com e a API. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://salve-backend.onrender.com https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'self';">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SALVe — Processo</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2C383D">
<link rel="icon" href="favicon-48.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<link rel="stylesheet" href="pericia.css">
</head>
<body>
<div id="nav"></div>
<div class="wrap" id="wrap" style="display:none">
  <p style="margin:0 0 10px"><a href="processos.html" class="small" style="color:var(--blue);font-weight:600;text-decoration:none">‹ Todos os processos</a></p>
  <div id="sema"></div>
  <nav class="tabs" id="tabs" aria-label="Etapas do processo"></nav>
  <div id="panes"></div>
</div>
<div class="gate" id="gate" style="display:none"></div>

<script src="pericia-core.js"></script>
<script>
"use strict";
const { $, esc, dBR, brl, hoje, toast, api, post, del, baixar, lerArquivo, enviarEmBlocos, montarNav, refs, optHTML,
  origemHTML, lerOrigem, citar, pillClasse, editorLinhas, schemaHTML, lerSchema, docPainel, pillSit, pillStatus } = SP;
const PID = new URLSearchParams(location.search).get("id");
let D = null, R = null, MODS = {}, BENS = [], TAB = new URLSearchParams(location.search).get("aba") || "geral";
const ED = {};   // editores de linhas vivos
const val = (id) => ($(id) || {}).value ?? "";
const P = () => D.proc;
const url = (s) => `/api/pericia/processos/${PID}${s || ""}`;

const TABS = [
  ["geral", "Visão geral"], ["ident", "Identificação"], ["crono", "Cronologia"], ["escopo", "Escopo"],
  ["quesitos", "Quesitos"], ["aceite", "Nomeação e aceite"], ["honor", "Honorários"], ["prazos", "Prazos"],
  ["dilig", "Diligência"], ["objeto", "Objeto e checklist"], ["evid", "Evidências"], ["analise", "Análise"],
  ["laudo", "Laudo"], ["pos", "Pós-laudo"], ["fin", "Financeiro"],
];
const contagem = () => ({ crono: D.eventos.length, quesitos: D.quesitos.length, prazos: D.prazos.length, dilig: D.diligencias.length,
  objeto: D.objetos.length, evid: D.evidencias.length, analise: D.analises.length, laudo: D.laudos.length, pos: D.esclarecimentos.length });

async function iniciar() {
  if (!PID) { location.href = "processos.html"; return; }
  try { await montarNav("processos.html"); } catch (e) { return; }
  R = await refs();
  await recarregar();
  $("wrap").style.display = "block";
}
async function recarregar() {
  try { D = await api(url()); }
  catch (e) { $("gate").style.display = "block"; $("gate").innerHTML = `<h3>Processo indisponível</h3><p>${esc(e.message)}</p>`; return; }
  const ids = new Set([...(P().modulos || []), ...D.objetos.map(o => o.moduloId)]);
  await Promise.all([...ids].filter(i => !MODS[i]).map(async i => { try { MODS[i] = await api("/api/modulos/" + i); } catch (e) {} }));
  if (!BENS.length) { try { BENS = await api("/api/salve/bens"); } catch (e) { BENS = []; } }
  document.title = "SALVe — " + (P().numero || "Processo");
  renderSema(); renderTabs(); mostrar(TAB);
}
async function salvarProc(parcial, msg) {
  try { await post("/api/pericia/processos", { id: PID, ...parcial }); toast(msg || "Alterações salvas."); await recarregar(); return true; }
  catch (e) { toast(e.message, true); return false; }
}
async function salvarFilho(col, body, msg) {
  try { const r = await post(url("/" + col), body); toast(msg || "Registro salvo."); await recarregar(); return r; }
  catch (e) { toast(e.message, true); return null; }
}
async function excluirFilho(col, id) {
  if (!confirm("Excluir este registro?")) return;
  try { await del(url(`/${col}/${id}`)); toast("Registro excluído."); await recarregar(); } catch (e) { toast(e.message, true); }
}
async function fluxo(cmd, body, timeoutMs) {
  try { return await post(url("/fluxos/" + cmd), body || {}, timeoutMs); } catch (e) { toast(e.message, true); return null; }
}

// ── cabeçalho (semáforo) ──
function renderSema() {
  const r = D.resumo, st = r.status, a = r.proximaAcao;
  $("sema").innerHTML = `<div class="sema ${st.cor}"><div class="luz"></div><div class="corpo">
    <div><h1 class="mono">${esc(P().numero || "Processo sem número")}</h1>
      <div class="small muted">${esc([P().tribunal, P().comarca, P().vara].filter(Boolean).join(" · ") || "Tribunal e vara não informados")}</div>
      <div class="st" style="margin-top:6px">${st.icone} ${esc(st.rotulo)}</div>
      <div class="small muted" style="margin-top:4px">${esc(P().objeto || "")}</div></div>
    <div><div class="acao${a.urgente ? " urg" : ""}"><b>Próxima ação do perito</b>${esc(a.acao)}
      ${a.comando && CMD_TAB[a.comando] ? `<div style="margin-top:6px"><button class="btn sm" data-ir="${CMD_TAB[a.comando]}">Ir para ${esc((TABS.find(t => t[0] === CMD_TAB[a.comando]) || [])[1])}</button></div>` : ""}</div>
      <div class="row small" style="margin-top:8px;gap:14px">
        <span>Prazo do laudo: <b>${dBR(r.prazoLaudo)}</b></span><span>Diligência: <b>${dBR(r.dataDiligencia)}</b></span>
        <span>Honorários: <b class="mono">${r.honorariosArbitrados ? brl(r.honorariosArbitrados) + " arb." : r.honorariosPropostos ? brl(r.honorariosPropostos) + " prop." : "—"}</b></span>
        <span>Pendências: <b>${r.pendencias}</b></span></div></div></div></div>`;
  $("sema").querySelectorAll("[data-ir]").forEach(b => b.onclick = () => mostrar(b.dataset.ir));
}
const CMD_TAB = { analisar: "geral", atualizar: "crono", aceite: "aceite", honorarios: "honor", agendar: "dilig", diligencia: "objeto", laudo: "laudo", quesitos: "quesitos", pagamento: "fin" };

function renderTabs() {
  const c = contagem();
  $("tabs").innerHTML = TABS.map(([k, t]) => `<button class="tab${k === TAB ? " on" : ""}" data-t="${k}">${esc(t)}${c[k] ? `<span class="n">${c[k]}</span>` : ""}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => mostrar(b.dataset.t));
}
function mostrar(t) {
  TAB = t;
  history.replaceState(null, "", `?id=${encodeURIComponent(PID)}&aba=${t}`);
  $("tabs").querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  $("panes").innerHTML = `<div class="pane on" id="pane"></div>`;
  (RENDER[t] || (() => {}))($("pane"));
}
const card = (titulo, corpo, dir) => `<div class="card"><div class="ch"><h2>${esc(titulo)}</h2>${dir || ""}</div><div class="cb">${corpo}</div></div>`;
const fld = (id, rot, v, tipo, extra) => `<div class="fld${extra || ""}"><label for="${id}">${esc(rot)}</label>${tipo === "textarea" ? `<textarea id="${id}">${esc(v ?? "")}</textarea>` : `<input id="${id}" type="${tipo || "text"}" value="${esc(v ?? "")}"${tipo === "number" ? ' step="any"' : ""}>`}</div>`;
const sel = (id, rot, lista, v, extra) => `<div class="fld${extra || ""}"><label for="${id}">${esc(rot)}</label><select id="${id}">${optHTML(lista, v, "—")}</select></div>`;
const SIM_NAO = [{ id: "sim", label: "Sim" }, { id: "nao", label: "Não" }, { id: "a_verificar", label: "A verificar" }];
const nomeMod = (id) => (MODS[id] && MODS[id].nome) || id;
const rotEv = (id) => { const e = D.evidencias.find(x => x.id === id); return e ? e.codigo : "?"; };
const multiEv = (px, marcados) => `<div class="row small" id="${px}" style="gap:10px">${D.evidencias.length ? D.evidencias.map(e => `<label class="row" style="gap:4px"><input type="checkbox" value="${esc(e.id)}"${(marcados || []).includes(e.id) ? " checked" : ""}> ${esc(e.codigo)} <span class="muted">${esc((e.legenda || e.descricao || "").slice(0, 30))}</span></label>`).join("") : '<span class="muted">Nenhuma evidência cadastrada.</span>'}</div>`;
const lerMulti = (px) => [...document.querySelectorAll(`#${px} input:checked`)].map(i => i.value);

const RENDER = {};

// ── Visão geral ──
RENDER.geral = (el) => {
  const pend = D.pendencias;
  el.innerHTML = card("Status e pendências", `
    ${D.resumo.status.motivos.length ? `<div class="${D.resumo.status.cor === "vermelho" ? "blq" : "aviso"}"><b>${D.resumo.status.icone} ${esc(D.resumo.status.rotulo)}</b><ul style="margin:6px 0 0 18px;padding:0">${D.resumo.status.motivos.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>` : ""}
    <div class="tscroll"><table><thead><tr><th>Informação ausente</th><th>Impacto</th><th>Providência</th><th></th></tr></thead><tbody>
    ${pend.length ? pend.map(p => `<tr><td>${esc(p.informacao)}</td><td class="small">${esc(p.impacto || "")}</td><td class="small">${esc(p.providencia || "")}</td>
      <td>${p.derivada ? '<span class="pill neu">automática</span>' : `<button class="btn sm ghost" data-res="${esc(p.id)}">Resolvida</button>`}</td></tr>`).join("") : '<tr><td colspan="4" class="empty">Sem pendências registradas.</td></tr>'}
    </tbody></table></div>
    <h3 class="small" style="margin:16px 0 6px">Registrar pendência manual</h3>
    <div class="grid g3">${fld("pdInfo", "Informação ausente", "")}${fld("pdImp", "Impacto", "")}
      ${sel("pdProv", "Providência recomendada", ["Peticionar", "Solicitar documento", "Verificar objeto", "Realizar ensaio", "Aguardar decisão", "Outra"], "")}</div>
    <div class="row end" style="margin-top:10px"><button class="btn ghost" id="pdAdd">Adicionar pendência</button></div>`,
    `<div class="row"><button class="btn ghost" id="bAtualizar">Atualizar processo</button><button class="btn" id="bAnalisar">Analisar processo</button></div>`)
    + `<div id="saidaAnalise"></div>`;
  el.querySelectorAll("[data-res]").forEach(b => b.onclick = () => salvarProc({ pendencias: (P().pendencias || []).map(p => p.id === b.dataset.res ? { ...p, resolvida: true } : p) }, "Pendência resolvida."));
  $("pdAdd").onclick = () => { if (!val("pdInfo").trim()) return toast("Descreva a informação ausente.", true);
    salvarProc({ pendencias: [...(P().pendencias || []), { informacao: val("pdInfo"), impacto: val("pdImp"), providencia: val("pdProv") }] }, "Pendência registrada."); };
  $("bAnalisar").onclick = () => analisar("analisar");
  $("bAtualizar").onclick = () => analisar("atualizar");
};
async function analisar(cmd) {
  const out = await fluxo(cmd); if (!out) return;
  const a = out.resultado, id = a.identificacao, NL = R.naoLocalizado;
  const v = (x) => x ? esc(x) : `<span class="nl">${esc(NL)}</span>`;
  const bl = (t, b) => `<div class="fld"><label>${esc(t)}</label><div>${b.origem === null ? `<span class="nl">${esc(NL)}</span>` : esc(b.texto) + `<div class="small muted">Fonte: ${esc(b.origem)}</div>`}</div></div>`;
  $("saidaAnalise").innerHTML = card(cmd === "atualizar" ? "Atualização do processo" : "Auditoria do processo", `
    ${cmd === "atualizar" ? `<div class="aviso">Novos eventos desde a última análise: <b>${(a.novosEventos || []).length}</b>${a.statusAnterior ? ` · status anterior: ${esc(a.statusAnterior.icone + " " + a.statusAnterior.rotulo)}` : ""}</div>` : ""}
    <h3>Identificação</h3><div class="grid g3 small">
      <div>Processo: <b>${v(id.processo)}</b></div><div>Tribunal: <b>${v(id.tribunal)}</b></div><div>Vara: <b>${v(id.vara)}</b></div>
      <div>Juiz(a): <b>${v(id.juiz)}</b></div><div>Nomeação: <b>${id.dataNomeacao ? dBR(id.dataNomeacao) : v(null)}</b></div><div>Valor da causa: <b>${id.valorCausa ? brl(id.valorCausa) : v(null)}</b></div>
      <div class="span2">Objeto: <b>${v(id.objeto)}</b></div><div>Localização: <b>${v(id.localizacaoObjeto)}</b></div>
      <div class="spanall">Partes: ${id.partes.length ? id.partes.map(p => `${esc(p.polo)}: <b>${esc(p.nome || "")}</b> (gratuidade: ${esc(p.gratuidade || "não verificada")})`).join("; ") : v(null)}</div>
      <div>Data da análise: <b>${dBR(id.dataAnalise)}</b></div></div>
    <h3>Cronologia processual</h3><div class="tscroll"><table><thead><tr><th>Data</th><th>Evento/ID</th><th>Documento</th><th>Conteúdo relevante</th><th>Consequência para o perito</th></tr></thead><tbody>
    ${a.cronologia.length ? a.cronologia.map(e => `<tr${(a.novosEventos || []).some(n => n.data === e.data && n.conteudo === e.conteudo) ? ' style="background:var(--blue-bg)"' : ""}><td>${dBR(e.data)}</td><td class="mono">${esc(e.evento)}</td><td>${esc(e.documento || "")}</td><td>${esc(e.conteudo || "")} ${pillClasse(e.classe)}</td><td>${esc(e.consequencia || "")}</td></tr>`).join("") : `<tr><td colspan="5" class="empty">Nenhum evento cadastrado.</td></tr>`}</tbody></table></div>
    <h3>Escopo da controvérsia</h3><div class="grid g2">${bl("Alegação do autor", a.escopo.alegacaoAutor)}${bl("Alegação da parte ré", a.escopo.alegacaoReu)}${bl("Pontos incontroversos", a.escopo.incontroversos)}${bl("Pontos controvertidos", a.escopo.controvertidos)}${bl("Objeto determinado pelo Juízo", a.escopo.objetoJuizo)}${bl("Questões submetidas à perícia", a.escopo.questoesPericia)}</div>
    <h3>Quesitos (${a.quesitos.length})</h3>${a.quesitos.map(q => `<div class="q"><b>${esc((R.autoresQuesito.find(x => x.id === q.autor) || {}).label || q.autor)} — ${esc(q.numero || "")}</b><div class="txt">${esc(q.texto)}</div><div class="small muted">Fonte: ${esc(q.origem)}</div></div>`).join("") || `<p class="nl">${esc(NL)}</p>`}
    <h3>Auditoria da nomeação</h3><table><tbody>${a.auditoria.map(x => `<tr><td>${esc(x.item)}</td><td>${x.situacao === NL ? `<span class="nl">${esc(NL)}</span>` : esc(x.situacao)}</td></tr>`).join("")}</tbody></table>
    <h3>Status do processo</h3><p>${pillStatus(a.status)}</p>
    <h3>Ação recomendada ao perito</h3><div class="acao">${esc(a.proximaAcao.acao)}</div>`,
    `<button class="btn sm ghost" id="bCopiarAnalise">Copiar como texto</button>`);
  $("bCopiarAnalise").onclick = async () => { await navigator.clipboard.writeText($("saidaAnalise").innerText); toast("Análise copiada."); };
  renderSema();
}

// ── Identificação ──
RENDER.ident = (el) => {
  const p = P();
  const mods = R.modulos;
  el.innerHTML = card("Dados do processo", `<div class="grid g3">
      ${fld("iNumero", "Número (CNJ)", p.numero)}${sel("iTribunal", "Tribunal", ["TJGO", "TJDFT", "Outro"], p.tribunal)}${fld("iComarca", "Comarca / circunscrição", p.comarca)}
      ${fld("iVara", "Vara", p.vara)}${fld("iJuiz", "Juiz(a)", p.juiz)}${fld("iClasse", "Classe processual", p.classe)}
      ${fld("iValor", "Valor da causa (R$)", p.valorCausa, "number")}${fld("iNomeacao", "Data da nomeação", p.dataNomeacao, "date")}${fld("iNomeacaoId", "ID da decisão de nomeação", p.nomeacaoId)}
      ${fld("iPrazo", "Prazo concedido (texto da decisão)", p.prazoConcedido)}${fld("iLocal", "Localização conhecida do objeto", p.localizacaoObjeto, "text", " span2")}
      ${fld("iObjeto", "Objeto da perícia", p.objeto, "textarea", " spanall")}
      <div class="fld spanall"><label>Módulos técnicos do objeto</label><div class="row" id="iMods">${mods.map(m => `<label class="row small" style="gap:4px"><input type="checkbox" value="${esc(m.id)}"${(p.modulos || []).includes(m.id) ? " checked" : ""}> ${esc(m.nome)}</label>`).join("")}</div></div>
    </div>`) +
    card("Partes, advogados, gratuidade e assistentes técnicos", `<div id="edPartes"></div>`) +
    card("Acesso de outros usuários", `<p class="small muted">Dono: ${esc(p._ownerEmail || "")}</p>
      <div class="row">${(p.acessos || []).map(e => `<span class="pill inf">${esc(e)} ${D.podeGerir ? `<button class="btn sm ghost" style="padding:0 4px;border:0" data-rmac="${esc(e)}" aria-label="Remover acesso">✕</button>` : ""}</span>`).join("") || '<span class="muted small">Somente o dono e administradores.</span>'}</div>
      ${D.podeGerir ? `<div class="row" style="margin-top:10px"><input id="acEmail" placeholder="e-mail do colaborador" style="max-width:280px"><button class="btn ghost" id="acAdd">Liberar acesso</button></div>` : ""}`) +
    `<div class="row end"><button class="btn danger" id="bExcluir"${D.podeGerir ? "" : " disabled"}>Excluir processo</button><button class="btn" id="bSalvarIdent">Salvar identificação</button></div>`;
  ED.partes = editorLinhas($("edPartes"), [
    { k: "polo", rot: "Polo", tipo: "select", opts: [{ id: "autor", label: "Autor" }, { id: "reu", label: "Réu" }, { id: "terceiro", label: "Terceiro" }, { id: "mp", label: "Ministério Público" }], w: "120px" },
    { k: "nome", rot: "Nome" }, { k: "advogado", rot: "Advogado(a) / OAB" },
    { k: "gratuidade", rot: "Gratuidade", tipo: "select", w: "150px", opts: [{ id: "deferida", label: "Deferida" }, { id: "indeferida", label: "Indeferida" }, { id: "pendente", label: "Pedido pendente" }, { id: "nao_requerida", label: "Não requerida" }, { id: "nao_localizada", label: "Não localizada" }] },
    { k: "gratuidadeId", rot: "ID decisão", w: "110px" }, { k: "assistenteNome", rot: "Assistente técnico" }, { k: "assistenteContato", rot: "Contato do assistente" },
  ], (p.partes || []).map(x => ({ ...x, assistenteNome: x.assistente?.nome, assistenteContato: x.assistente?.contato })), { rotuloAdd: "Adicionar parte" });
  $("bSalvarIdent").onclick = () => salvarProc({
    numero: val("iNumero").trim(), tribunal: val("iTribunal"), comarca: val("iComarca"), vara: val("iVara"), juiz: val("iJuiz"), classe: val("iClasse"),
    valorCausa: val("iValor") === "" ? null : Number(val("iValor")), dataNomeacao: val("iNomeacao"), nomeacaoId: val("iNomeacaoId"),
    prazoConcedido: val("iPrazo"), localizacaoObjeto: val("iLocal"), objeto: val("iObjeto"),
    modulos: [...document.querySelectorAll("#iMods input:checked")].map(i => i.value),
    partes: ED.partes.get().map(({ assistenteNome, assistenteContato, ...x }) => ({ ...x, assistente: { nome: assistenteNome || "", contato: assistenteContato || "" } })),
  }, "Identificação salva.");
  el.querySelectorAll("[data-rmac]").forEach(b => b.onclick = async () => { try { await del(url("/acessos/" + encodeURIComponent(b.dataset.rmac))); await recarregar(); } catch (e) { toast(e.message, true); } });
  if ($("acAdd")) $("acAdd").onclick = async () => { try { await post(url("/acessos"), { email: val("acEmail") }); toast("Acesso liberado."); await recarregar(); } catch (e) { toast(e.message, true); } };
  $("bExcluir").onclick = async () => { if (!confirm("Excluir o processo e TODOS os registros e arquivos vinculados? Esta ação não pode ser desfeita.")) return;
    try { await del(url()); location.href = "processos.html"; } catch (e) { toast(e.message, true); } };
};

// ── Cronologia ──
// PDF consolidado dos autos (até 100 MB): enviado em blocos pequenos (nunca
// o arquivo inteiro de uma vez, nem no navegador nem no servidor) e lido por
// IA em segundo plano, também em blocos de páginas — a resposta do envio
// volta na hora, sem esperar a leitura terminar. Cada documento identificado
// vira uma peça rascunho (aba "Peças processuais" abaixo) — revise e
// confirme lá, exatamente como numa peça enviada manualmente, para a
// cronologia/escopo; nada aqui grava evento sozinho.
const ST_AUTOS = { processando: ["at", "Lendo em segundo plano…"], lido: ["ok", "Leitura concluída"], parcial: ["inf", "Concluído, com bloco(s) com erro"], erro: ["no", "Erro na leitura"] };
let TIMER_AUTOS = null;
function pillAutos(a) { const x = ST_AUTOS[a.status] || ["neu", a.status || "—"]; return `<span class="pill ${x[0]}">${esc(x[1])}</span>`; }
async function enviarAutos() {
  const file = ($("atArq").files || [])[0];
  if (!file) return toast("Selecione um arquivo PDF.", true);
  const prompt = val("atPrompt");
  const btn = $("atEnviar"), txt = btn.textContent;
  btn.disabled = true;
  try {

// Peças processuais (PDF): upload → leitura por IA (sugestão) → revisão do
// perito → confirmação, que é o que de fato grava um evento na cronologia
// (com origem rastreável à peça). Nada que a IA devolve vira fato sozinho.
const ST_PECA = { processando: ["at", "Lendo…"], lido: ["inf", "Lido — revisar"], erro: ["no", "Erro na leitura"] };
function pillPeca(p) {
  if (p.confirmado) return '<span class="pill ok">Na cronologia</span>';
  const x = ST_PECA[p.status] || ["neu", p.status || "—"];
  return `<span class="pill ${x[0]}">${esc(x[1])}</span>`;
}
async function enviarPeca() {
  const file = ($("pzArq").files || [])[0];
  if (!file) return toast("Selecione um arquivo PDF.", true);
  if (file.size > 8 * 1024 * 1024) return toast("Arquivo acima de 8 MB.", true);
  const b64 = await lerArquivo(file);
  const btn = $("pzEnviar"), txt = btn.textContent;
  btn.disabled = true; btn.textContent = "Enviando e lendo com IA (pode levar até 3 min)…";
  try {
    await post(url("/pecas"), { arquivoBase64: b64, nomeOriginal: file.name, tipo: val("pzTipo"), parte: val("pzParte"), data: val("pzData") }, 180000);
    toast("PDF enviado."); await recarregar();
  } catch (e) { toast(e.message, true); }
  finally { if ($("pzEnviar")) { $("pzEnviar").disabled = false; $("pzEnviar").textContent = txt; } }
}

  if ($("oAdd")) $("oAdd").onclick = () => salvarFilho("objetos", { moduloId: val("oNovo"), dados: {}, checklist: {} }, "Objeto adicionado.");
  D.objetos.forEach((o, i) => renderObjeto($("obj_" + o.id), o, i));
};
/* Um item só "abre" depois que as características que o condicionam são informadas.
   Só se aplica a módulos que declaram `blocos` (sequência de checklist por bloco,
   ex.: elevadores): todo bloco além do primeiro (identificação) fica oculto até haver
   um TIPO escolhido; itens com `tipos`/`tiposExcluidos`/`acionamentos` próprios refinam
   ainda mais o filtro. Módulos sem `blocos` (comportamento antigo) não são afetados. */
function itemAplicavel(it, dados, m) {
  const d = dados || {};
  const blocoInicial = m && Array.isArray(m.blocos) && m.blocos.length ? m.blocos[0].id : null;
  if (blocoInicial && it.grupo !== blocoInicial && !d.tipo) return false;
  if (it.tipos && (!d.tipo || !it.tipos.includes(d.tipo))) return false;
  if (it.tiposExcluidos && d.tipo && it.tiposExcluidos.includes(d.tipo)) return false;
  if (it.acionamentos && (!d.acionamento || !it.acionamentos.includes(d.acionamento))) return false;
  return true;
}
function nomeBloco(m, gid) {
  const b = (m.blocos || []).find(x => x.id === gid);
  return b ? `${b.nome}${b.ref ? " — " + b.ref : ""}` : gid;
}
function renderObjeto(box, o, i) {
  const m = MODS[o.moduloId];
  if (!m) { box.innerHTML = card("Objeto " + (i + 1), `<p class="blq">Módulo ${esc(o.moduloId)} indisponível.</p>`); return; }
  const px = "o" + i;
  const dadosAtuais = o.dados || {};
  const todosItens = Object.values(m.checklists || {}).flat();
  const itens = todosItens.filter(it => itemAplicavel(it, dadosAtuais, m));
  const grupos = (m.blocos && m.blocos.length)
    ? m.blocos.map(b => b.id).filter(gid => itens.some(x => x.grupo === gid))
    : [...new Set(itens.map(x => x.grupo))];
  const feitos = itens.filter(x => o.checklist?.[x.id]?.status && o.checklist[x.id].status !== "pendente").length;
  const blocoInicial = m.blocos && m.blocos.length ? m.blocos[0].id : null;
  const fechado = !!blocoInicial && todosItens.some(it => it.grupo !== blocoInicial) && !itens.some(it => it.grupo !== blocoInicial);
  box.innerHTML = card(`Objeto ${i + 1} — ${m.nome}`, `
    ${(o.alertas || []).length ? `<div class="aviso"><ul style="margin:0 0 0 18px;padding:0">${o.alertas.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>` : ""}
    ${schemaHTML(m.schemaObjeto, dadosAtuais, px, BENS)}
    <div class="chk-grupo">Ensaios e medições previstos</div><div class="row small" id="${px}_ens">${m.ensaios.map(e => `<label class="row" style="gap:4px"><input type="checkbox" value="${esc(e.id)}"${(o.ensaiosSelecionados || []).includes(e.id) ? " checked" : ""}> ${esc(e.nome)}${e.requerCustodia ? ' <span class="pill at">custódia</span>' : ""}</label>`).join("")}</div>
    <div class="chk-grupo" style="margin-top:18px">Checklist de verificação, por blocos <span class="pill ${itens.length && feitos === itens.length ? "ok" : "at"}">${feitos}/${itens.length}</span></div>
    ${fechado ? `<div class="aviso">Informe <b>Tipo</b> e <b>Acionamento</b> acima para abrir os blocos de checklist aplicáveis a este elevador, conforme a norma.</div>` : ""}
    ${grupos.map(g => `<div class="small muted" style="margin-top:10px;font-weight:600">${esc(nomeBloco(m, g))}</div>` + itens.filter(x => x.grupo === g).map(it => {
      const r = (o.checklist || {})[it.id] || {};
      return `<div class="chk-item"><div>${esc(it.texto)}${it.ref ? ` <span class="small muted">(${esc(it.ref)})</span>` : ""}<div class="small muted">evidência esperada: ${esc(it.evidenciaEsperada)}</div></div>
        <select data-cs="${esc(it.id)}" aria-label="Resultado">${optHTML(ST_CHK, r.status || "pendente")}</select>
        <textarea data-co="${esc(it.id)}" rows="1" placeholder="Observação objetiva" aria-label="Observação">${esc(r.obs || "")}</textarea>
        <input data-ce="${esc(it.id)}" value="${esc((r.evidencias || []).map(rotEv).join(", "))}" placeholder="EV-001, EV-002" aria-label="Evidências"></div>`;
    }).join("")).join("")}
    <div class="grid g2" style="margin-top:14px">
      <div class="fld"><label>Sistemas de referência</label><div class="small muted">${esc((m.sistemas || []).join(" · "))}</div></div>
      <div class="fld"><label>Referências normativas do módulo</label><div class="small">${(m.normasDetalhe || []).map(n => `${esc(n.identificacao)} — <span class="muted">${esc(n.vigencia)}</span>`).join("<br>") || "—"}</div></div></div>
    <div class="row end" style="margin-top:12px"><button class="btn danger" id="${px}_rm">Remover objeto</button><button class="btn ghost" id="${px}_val">Validar</button><button class="btn" id="${px}_sv">Salvar objeto e checklist</button></div>`);
  const ler = () => {
    const checklist = { ...(o.checklist || {}) };   // preserva respostas de itens que, por ora, ficaram fora do filtro
    const porCodigo = new Map(D.evidencias.map(e => [e.codigo.toUpperCase(), e.id]));
    itens.forEach(it => {
      const evs = (box.querySelector(`[data-ce="${it.id}"]`).value || "").split(/[,;\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
      const desconhecidos = evs.filter(c => !porCodigo.has(c));
      if (desconhecidos.length) throw new Error(`Evidência inexistente no item “${it.texto}”: ${desconhecidos.join(", ")}`);
      checklist[it.id] = { status: box.querySelector(`[data-cs="${it.id}"]`).value, obs: box.querySelector(`[data-co="${it.id}"]`).value, evidencias: evs.map(c => porCodigo.get(c)) };
    });
    return { id: o.id, moduloId: o.moduloId, dados: lerSchema(m.schemaObjeto, px), checklist, ensaiosSelecionados: [...box.querySelectorAll(`#${px}_ens input:checked`)].map(x => x.value) };
  };
  $(px + "_sv").onclick = () => { try { salvarFilho("objetos", ler(), "Objeto salvo."); } catch (e) { toast(e.message, true); } };

    ED.itens = editorLinhas($("edItens"), [{ k: "texto", rot: "Questionamento (transcrição)", tipo: "textarea" },
      { k: "natureza", rot: "Natureza", tipo: "select", w: "120px", opts: [{ id: "tecnica", label: "Técnica" }, { id: "juridica", label: "Jurídica" }] },
      { k: "jaRespondido", rot: "Já respondido?", tipo: "check", w: "80px" }, { k: "trechoLaudo", rot: "Trecho do laudo", w: "150px", ph: "seção 15, quesito 3…" },
      { k: "resposta", rot: "Resposta técnica", tipo: "textarea" }, { k: "correcaoMaterial", rot: "Correção de erro material", tipo: "textarea" }], e.itens, { rotuloAdd: "Adicionar questionamento" });
    $("mSalvar").onclick = () => salvarFilho("esclarecimentos", { id: e.id, manifestacao: { parte: val("mParte"), documentoId: val("mId"), data: val("mData") }, itens: ED.itens.get(), status: val("mSit") }, "Manifestação salva.");
    if ($("mCanc")) $("mCanc").onclick = () => form();
    if ($("mGerar")) $("mGerar").onclick = async () => {
      try { await post(url("/esclarecimentos"), { id: e.id, manifestacao: { parte: val("mParte"), documentoId: val("mId"), data: val("mData") }, itens: ED.itens.get(), status: val("mSit") }); }
      catch (x) { return toast(x.message, true); }
      const out = await fluxo("esclarecimentos", { esclarecimentoId: e.id }); if (out) docPainel($("mDoc"), out, PID);
    };
  };
  form(D.esclarecimentos.find(x => x.status !== "protocolado"));
  el.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => form(D.esclarecimentos.find(x => x.id === b.dataset.ed)));
  el.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => excluirFilho("esclarecimentos", b.dataset.rm));
};

// ── Financeiro ──
RENDER.fin = (el) => {
  const h = P().honorarios || {}, f = D.financeiro;
  el.innerHTML = `<div class="grid g4" style="margin-bottom:18px">
      ${[["Propostos", f.proposto], ["Arbitrados", f.arbitrado], ["Depositados", f.depositado], ["Recebidos", f.recebido]].map(([t, v]) => `<div class="card cb"><div class="small muted">${t}</div><b class="mono" style="font-size:18px">${brl(v)}</b></div>`).join("")}</div>
    ${f.aEsclarecer > 0 ? `<div class="blq">Crédito de natureza não esclarecida: <b>${brl(f.aEsclarecer)}</b>. Não presuma que se trata de honorários — gere o pedido de esclarecimento abaixo.</div>` : ""}
    ${f.saldo !== null ? `<div class="acao" style="margin-bottom:18px"><b>Saldo a receber</b><span class="mono">${brl(f.saldo)}</span> · retenções lançadas: ${brl(f.retencoes)}</div>` : ""}` +
    card("Liberação", `<div class="grid g4">
      ${sel("fHom", "Laudo homologado?", [{ id: "sim", label: "Sim" }, { id: "nao", label: "Não" }, { id: "a_verificar", label: "A verificar" }], h.homologado)}
      ${fld("fHomId", "ID da homologação", h.homologacaoId)}
      ${sel("fForma", "Forma de pagamento", [{ id: "alvara", label: "Alvará / transferência judicial" }, { id: "requisicao", label: "Requisição administrativa (custeio público)" }, { id: "direto", label: "Depósito direto determinado" }, { id: "a_verificar", label: "A verificar" }], h.formaPagamento)}
      ${sel("fDados", "Dados bancários solicitados/informados?", [{ id: "sim", label: "Sim" }, { id: "nao", label: "Não" }], h.dadosBancarios)}</div>`) +
    card("Depósitos nos autos", `<div id="edDep"></div>`) + card("Alvarás / requisições", `<div id="edAlv"></div>`) +
    card("Recebimentos na conta do perito", `<div id="edRec"></div>`) + card("Retenções tributárias", `<div id="edRet"></div>`) +
    `<div class="row end"><button class="btn ghost" id="fPet">Pedir esclarecimento sobre crédito</button><button class="btn" id="fSalvar">Salvar financeiro</button></div><div id="fDoc" style="margin-top:12px"></div>`;
  const dv = [{ k: "data", rot: "Data", tipo: "date", w: "150px" }, { k: "valor", rot: "Valor (R$)", tipo: "number", w: "140px" }];
  ED.dep = editorLinhas($("edDep"), [...dv, { k: "parte", rot: "Depositante" }, { k: "documentoId", rot: "ID nos autos", w: "140px" }], h.depositos);
  ED.alv = editorLinhas($("edAlv"), [...dv, { k: "numero", rot: "Número / tipo" }, { k: "documentoId", rot: "ID nos autos", w: "140px" }], h.alvaras);
  ED.rec = editorLinhas($("edRec"), [...dv, { k: "origem", rot: "Origem identificada no extrato" },
    { k: "natureza", rot: "Natureza", tipo: "select", w: "200px", opts: [{ id: "honorarios", label: "Honorários (determinação nos autos)" }, { id: "adiantamento", label: "Adiantamento determinado" }, { id: "a_esclarecer", label: "Sem determinação clara — a esclarecer" }] },
    { k: "documentoId", rot: "ID da determinação", w: "140px" }], h.recebimentos, { novo: { natureza: "a_esclarecer" } });
  ED.ret = editorLinhas($("edRet"), [{ k: "descricao", rot: "Tributo / retenção" }, { k: "valor", rot: "Valor (R$)", tipo: "number", w: "140px" }], h.retencoes);
  const salvar = () => salvarProc({ honorarios: { ...h, homologado: val("fHom"), homologacaoId: val("fHomId"), formaPagamento: val("fForma"), dadosBancarios: val("fDados"),
    depositos: ED.dep.get(), alvaras: ED.alv.get(), recebimentos: ED.rec.get(), retencoes: ED.ret.get() } }, "Financeiro salvo.");
  $("fSalvar").onclick = salvar;
  $("fPet").onclick = async () => { if (!await salvar()) return; const out = await fluxo("pagamento"); if (out) { TAB = "fin"; docPainel($("fDoc"), out, PID); } };
};

iniciar();
</script>
